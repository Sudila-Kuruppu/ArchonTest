[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "deterministic-skill-agent-builder"
version = "0.1.0"
description = "Builder for deterministic skill agents"
requires-python = ">=3.10"
dependencies = [
    "click==8.4.1",
    "jinja2==3.1.6",
    "pyyaml==6.0.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0",
]

[tool.setuptools.packages.find]
include = ["scripts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
