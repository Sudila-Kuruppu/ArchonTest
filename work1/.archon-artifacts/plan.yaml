meta:
  name: "dresscave-phase0-setup"
  description: "Phase 0 prerequisite setup for DressCave Next.js e-commerce — project init, UI library, state management, testing, validation, image config, Tailwind tokens"
  created: "2026-06-06"

scope:
  in_scope:
    - "Initialize Next.js 14.x project with TypeScript, Tailwind CSS, ESLint, App Router via create-next-app@14.2"
    - "Install and initialize shadcn/ui with core components: button, card, input, select, dialog"
    - "Install Zustand (cart/wishlist stores) and nuqs (URL state management) with SSR-safe patterns"
    - "Create Zustand stores: cart.ts, wishlist.ts, store-provider.tsx (SSR-safe Context pattern)"
    - "Add NuqsAdapter to root layout for URL state management"
    - "Install Vitest, React Testing Library, jsdom for unit/component testing"
    - "Configure vitest.config.ts with jsdom environment and path aliases"
    - "Install Zod, react-hook-form, @hookform/resolvers for data validation"
    - "Create Zod schema files: product.ts, order.ts, user.ts in lib/schemas/"
    - "Configure Next.js Image optimization with local/placeholder domains (no Supabase CDN)"
    - "Configure Tailwind CSS with mobile-first breakpoints, custom design tokens, 44px touch targets, 60fps animations"
    - "All work in dresscave/ directory"
  out_of_scope:
    - "Supabase setup, libraries, or configuration of any kind"
    - "Lib/supabase/ directory creation or client files"
    - "Playwright installation or configuration (CLI is pre-installed in environment)"
    - "Any e-commerce feature implementation (no product pages, cart UI, API routes, etc.)"
    - "Payment or checkout implementation"
    - "Auth implementation (will be Epic 1)"
    - "TanStack Query installation (deferred to later phases)"
    - "Any custom application components beyond shadcn/ui base components"
    - "Route groups or additional pages beyond scaffold defaults"

tasks:
  - id: "T1"
    description: "Initialize Next.js 14.x project with create-next-app@14.2"
    action: "CREATE"
    path: "dresscave/"
    depends: []
    patterns: []
    validate:
      - "ls /home/user/archontesting/work1/dresscave/package.json 2>&1"
      - "ls /home/user/archontesting/work1/dresscave/app/layout.tsx 2>&1"
      - "ls /home/user/archontesting/work1/dresscave/tsconfig.json 2>&1"
      - "ls /home/user/archontesting/work1/dresscave/tailwind.config.* 2>&1"
      - "ls /home/user/archontesting/work1/dresscave/next.config.* 2>&1"
      - "node -e \"const p = require('/home/user/archontesting/work1/dresscave/package.json'); console.log(p.dependencies.next)\" 2>&1"

  - id: "T2"
    description: "Install and initialize shadcn/ui with core components"
    action: "CREATE"
    path: "dresscave/"
    depends: ["T1"]
    patterns: []
    validate:
      - "ls /home/user/archontesting/work1/dresscave/components/ui/button.tsx 2>&1"
      - "ls /home/user/archontesting/work1/dresscave/components/ui/card.tsx 2>&1"
      - "ls /home/user/archontesting/work1/dresscave/components/ui/input.tsx 2>&1"
      - "ls /home/user/archontesting/work1/dresscave/components/ui/select.tsx 2>&1"
      - "ls /home/user/archontesting/work1/dresscave/components/ui/dialog.tsx 2>&1"
      - "ls /home/user/archontesting/work1/dresscave/lib/utils.ts 2>&1"
      - "ls /home/user/archontesting/work1/dresscave/components.json 2>&1"

  - id: "T3"
    description: "Install Zustand and nuqs, create SSR-safe stores, add NuqsAdapter to layout"
    action: "CREATE"
    path: "dresscave/"
    depends: ["T1"]
    patterns:
      - "/home/user/archontesting/work1/dresscave/architecture.md#state-management-section"
    validate:
      - "node -e \"require('/home/user/archontesting/work1/dresscave/node_modules/zustand/package.json')\" 2>&1"
      - "node -e \"require('/home/user/archontesting/work1/dresscave/node_modules/nuqs/package.json')\" 2>&1"
      - "ls /home/user/archontesting/work1/dresscave/lib/store/cart.ts 2>&1"
      - "ls /home/user/archontesting/work1/dresscave/lib/store/wishlist.ts 2>&1"
      - "ls /home/user/archontesting/work1/dresscave/lib/store/store-provider.tsx 2>&1"

  - id: "T4"
    description: "Install Vitest, React Testing Library; configure vitest.config.ts and test setup"
    action: "CREATE"
    path: "dresscave/"
    depends: ["T1"]
    patterns:
      - "/home/user/archontesting/work1/dresscave/architecture.md#testing-framework"
    validate:
      - "node -e \"require('/home/user/archontesting/work1/dresscave/node_modules/vitest/package.json')\" 2>&1"
      - "node -e \"require('/home/user/archontesting/work1/dresscave/node_modules/@testing-library/react/package.json')\" 2>&1"
      - "ls /home/user/archontesting/work1/dresscave/vitest.config.ts 2>&1"
      - "ls /home/user/archontesting/work1/dresscave/tests/setup.ts 2>&1"

  - id: "T5"
    description: "Install Zod, react-hook-form, @hookform/resolvers; create validation schemas"
    action: "CREATE"
    path: "dresscave/"
    depends: ["T1"]
    patterns:
      - "/home/user/archontesting/work1/dresscave/architecture.md#data-validation"
    validate:
      - "node -e \"require('/home/user/archontesting/work1/dresscave/node_modules/zod/package.json')\" 2>&1"
      - "node -e \"require('/home/user/archontesting/work1/dresscave/node_modules/react-hook-form/package.json')\" 2>&1"
      - "node -e \"require('/home/user/archontesting/work1/dresscave/node_modules/@hookform/resolvers/package.json')\" 2>&1"
      - "ls /home/user/archontesting/work1/dresscave/lib/schemas/product.ts 2>&1"
      - "ls /home/user/archontesting/work1/dresscave/lib/schemas/order.ts 2>&1"
      - "ls /home/user/archontesting/work1/dresscave/lib/schemas/user.ts 2>&1"

  - id: "T6"
    description: "Configure Next.js Image optimization with local/placeholder domains"
    action: "UPDATE"
    path: "dresscave/next.config.*"
    depends: ["T1"]
    patterns: []
    validate:
      - "npx --prefix /home/user/archontesting/work1/dresscave tsc --noEmit 2>&1 | tail -5"
      - "test -f /home/user/archontesting/work1/dresscave/next.config.* 2>&1"

  - id: "T7"
    description: "Configure Tailwind CSS with mobile-first tokens, 44px touch targets, 60fps animations"
    action: "UPDATE"
    path: "dresscave/tailwind.config.*"
    depends: ["T1"]
    patterns: []
    validate:
      - "npx --prefix /home/user/archontesting/work1/dresscave tsc --noEmit 2>&1 | tail -5"

validation:
  commands:
    dev_build: "cd /home/user/archontesting/work1/dresscave && npm run build 2>&1 | tail -20"
    type_check: "cd /home/user/archontesting/work1/dresscave && npx tsc --noEmit 2>&1"
    test: "cd /home/user/archontesting/work1/dresscave && npx vitest run --reporter=verbose 2>&1 | tail -30"
