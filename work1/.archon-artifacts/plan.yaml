meta:
  name: "fix-e2e-test-issues"
  description: "Fix 5 E2E test issues: hamburger menu, meta description, product images, emoji placeholders, and Google Fonts self-hosting"
  created: "2026-06-06"

scope:
  in_scope:
    - "Add @media (max-width: 767px) CSS rule to show hamburger button and toggle nav-links"
    - "Add <meta name='description'> tag to head.ejs for SEO"
    - "Add .coffee-card-img img CSS rule for proper image display in coffee cards"
    - "Add image URL field to all 8 menu items in menu.json"
    - "Replace ☕ emoji with <img> tags in home.ejs (featured coffees)"
    - "Replace ☕ emoji with <img> tags in menu.ejs (all menu items)"
    - "Create public/fonts/ directory and download WOFF2 font files for Playfair Display and Inter"
    - "Add @font-face declarations at top of style.css for self-hosted fonts"
    - "Remove Google Fonts external <link> tags from head.ejs"
  out_of_scope:
    - "Adding a build system or bundler"
    - "Adding a test framework or unit tests"
    - "Redesigning the layout or visual style"
    - "Adding new pages or routes"
    - "Changing menu data structure beyond adding image URLs"
    - "Adding accessibility features beyond what's specified"
    - "Performance optimization beyond font self-hosting"

tasks:
  - id: "T1"
    description: "Add responsive hamburger menu CSS rule for mobile (max-width: 767px)"
    action: "UPDATE"
    path: "coffee-shop/public/css/style.css"
    depends: []
    patterns: []
    validate:
      - "grep -q 'max-width: 767px' coffee-shop/public/css/style.css && echo 'PASS: media query found' || echo 'FAIL: media query missing'"
      - "grep -q '.hamburger { display: flex' coffee-shop/public/css/style.css && echo 'PASS: hamburger flex found' || echo 'FAIL: hamburger flex missing'"

  - id: "T2"
    description: "Add <meta name='description'> tag to head.ejs after viewport meta"
    action: "UPDATE"
    path: "coffee-shop/views/partials/head.ejs"
    depends: []
    patterns: []
    validate:
      - "grep -q 'meta name=\"description\"' coffee-shop/views/partials/head.ejs && echo 'PASS: meta description found' || echo 'FAIL: meta description missing'"

  - id: "T3"
    description: "Add CSS rule for coffee card images (.coffee-card-img img)"
    action: "UPDATE"
    path: "coffee-shop/public/css/style.css"
    depends: []
    patterns: []
    validate:
      - "grep -q '.coffee-card-img img' coffee-shop/public/css/style.css && echo 'PASS: img rule found' || echo 'FAIL: img rule missing'"

  - id: "T4"
    description: "Add image URL field to all 8 menu items in menu.json"
    action: "UPDATE"
    path: "coffee-shop/data/menu.json"
    depends: []
    patterns: []
    validate:
      - "node -e \"const d=require('./coffee-shop/data/menu.json'); d.forEach(i=>{if(!i.image)throw new Error('T4 FAIL: item '+i.id+' missing image')}); console.log('PASS: all ' + d.length + ' items have images')\""

  - id: "T5"
    description: "Replace emoji with <img> tag in home.ejs featured coffee cards"
    action: "UPDATE"
    path: "coffee-shop/views/pages/home.ejs"
    depends:
      - "T4"
    patterns:
      - "coffee-shop/views/pages/menu.ejs"
    validate:
      - "grep -q '<img' coffee-shop/views/pages/home.ejs && echo 'PASS: img tag found' || echo 'FAIL: img tag missing'"
      - "node --check coffee-shop/server.js 2>&1 && echo 'PASS: server syntax OK' || echo 'FAIL: server syntax error'"

  - id: "T6"
    description: "Replace emoji with <img> tag in menu.ejs all menu coffee cards"
    action: "UPDATE"
    path: "coffee-shop/views/pages/menu.ejs"
    depends:
      - "T4"
    patterns:
      - "coffee-shop/views/pages/home.ejs"
    validate:
      - "grep -q '<img' coffee-shop/views/pages/menu.ejs && echo 'PASS: img tag found' || echo 'FAIL: img tag missing'"
      - "node --check coffee-shop/server.js 2>&1 && echo 'PASS: server syntax OK' || echo 'FAIL: server syntax error'"

  - id: "T7"
    description: "Create public/fonts/ directory and download WOFF2 font files for self-hosting"
    action: "CREATE"
    path: "coffee-shop/public/fonts/"
    depends: []
    patterns: []
    validate:
      - "test -d coffee-shop/public/fonts/ && echo 'PASS: fonts dir exists' || echo 'FAIL: fonts dir missing'"
      - "ls coffee-shop/public/fonts/*.woff2 2>/dev/null && echo 'PASS: woff2 files found' || echo 'FAIL: no woff2 files'"

  - id: "T8"
    description: "Add @font-face declarations for Playfair Display and Inter at top of style.css"
    action: "UPDATE"
    path: "coffee-shop/public/css/style.css"
    depends:
      - "T7"
    patterns: []
    validate:
      - "grep -q '@font-face' coffee-shop/public/css/style.css && echo 'PASS: @font-face found' || echo 'FAIL: @font-face missing'"
      - "grep -q \"font-family: 'Playfair Display'\" coffee-shop/public/css/style.css && echo 'PASS: Playfair Display found' || echo 'FAIL: Playfair Display missing'"
      - "grep -q \"font-family: 'Inter'\" coffee-shop/public/css/style.css && echo 'PASS: Inter found' || echo 'FAIL: Inter missing'"

  - id: "T9"
    description: "Remove Google Fonts external <link> tags from head.ejs"
    action: "UPDATE"
    path: "coffee-shop/views/partials/head.ejs"
    depends:
      - "T7"
    patterns: []
    validate:
      - "grep -q 'fonts.googleapis.com' coffee-shop/views/partials/head.ejs && echo 'FAIL: Google Fonts link still present' || echo 'PASS: Google Fonts link removed'"
      - "grep -q 'stylesheet' coffee-shop/views/partials/head.ejs && echo 'PASS: local stylesheet still referenced' || echo 'FAIL: local stylesheet reference missing'"

validation:
  commands:
    syntax: "node --check coffee-shop/server.js 2>&1 && node --check coffee-shop/routes/index.js 2>&1 && echo 'PASS: syntax OK' || echo 'FAIL: syntax error'"
    json: "node -e \"JSON.parse(require('fs').readFileSync('./coffee-shop/data/menu.json','utf8'))\" && echo 'PASS: menu.json valid' || echo 'FAIL: menu.json invalid'"
    server: "timeout 3 node -e \"const app = require('./coffee-shop/server.js'); setTimeout(() => process.exit(0), 1000);\" 2>&1 | tail -5"
    lint: "echo 'INFO: No linter configured — skipping'"
    test: "echo 'INFO: No test framework configured — skipping'"
    build: "echo 'INFO: No build step configured — skipping'"
