meta:
  name: "epic-2-product-catalog-management"
  description: "Enable store administrators to manage the product catalog including creating products with variants, uploading images, organizing by categories, and marking items as featured/new arrivals."
  created: "2026-06-06"

scope:
  in_scope:
    - "SQL migration for products table, categories table, RLS policies, and Supabase Storage bucket"
    - "Expanded Zod schemas for products (CreateProductSchema, UpdateProductSchema) and categories"
    - "Server Actions for product CRUD (create, read, update, soft delete) and image management"
    - "Server Actions for category CRUD"
    - "Admin route protection with middleware (admin role check on profiles.is_admin)"
    - "Admin layout with sidebar for product/category management"
    - "Admin dashboard homepage with overview stats"
    - "Admin products list page with search/filter and inline featured/new arrival toggles"
    - "Reusable product form component (shared for create + edit)"
    - "Product create page + edit page (with dynamic [id] route)"
    - "Delete product confirmation dialog (soft delete)"
    - "Image upload component with drag-and-drop, preview, reorder, delete"
    - "Category management page with CRUD UI"
    - "Tests for product schemas validation"
    - "next.config.mjs update for Supabase Storage remote image patterns"

  out_of_scope:
    - "Storefront product display (homepage featured section, category browsing, product detail pages)"
    - "Shopping cart integration with products"
    - "Review/rating system"
    - "Order management from admin panel"
    - "Bulk product import/export"
    - "Product analytics or sales reports"
    - "Inventory tracking or stock management"
    - "Product sorting/filtering on storefront"
    - "Wishlist integration"

tasks:
  - id: "T1"
    description: "Create SQL migration file for products and categories tables, RLS policies, and Storage bucket"
    action: "CREATE"
    path: "dresscave/supabase/migrations/002_create_products.sql"
    depends: []
    patterns: []
    validate:
      - "test -f dresscave/supabase/migrations/002_create_products.sql && echo 'Migration file created'"

  - id: "T2"
    description: "Update product Zod schemas — add is_new_arrival, deleted_at, category_id FK; create CreateProductSchema, UpdateProductSchema; create CategorySchema and CategoryInputSchema"
    action: "UPDATE"
    path: "dresscave/lib/schemas/product.ts"
    depends: []
    patterns:
      - "dresscave/lib/schemas/user.ts"
    validate:
      - "npx vitest run --reporter=verbose 2>&1 | tail -30"

  - id: "T3"
    description: "Update next.config.mjs to add Supabase Storage remote pattern for product images"
    action: "UPDATE"
    path: "dresscave/next.config.mjs"
    depends: []
    patterns: []
    validate:
      - "npx tsc --noEmit 2>&1 | tail -20"

  - id: "T4"
    description: "Create product server actions — createProduct, updateProduct, deleteProduct (soft), getProducts, getProduct, setFeatured, setNewArrival, uploadImage, deleteImage"
    action: "CREATE"
    path: "dresscave/lib/actions/products.ts"
    depends: ["T2"]
    patterns:
      - "dresscave/lib/actions/auth.ts"
    validate:
      - "npx tsc --noEmit 2>&1 | tail -20"

  - id: "T5"
    description: "Create category server actions — createCategory, updateCategory, deleteCategory, getCategories"
    action: "CREATE"
    path: "dresscave/lib/actions/categories.ts"
    depends: ["T2"]
    patterns:
      - "dresscave/lib/actions/auth.ts"
    validate:
      - "npx tsc --noEmit 2>&1 | tail -20"

  - id: "T6"
    description: "Update middleware to protect /admin/* routes with admin role check against profiles.is_admin"
    action: "UPDATE"
    path: "dresscave/middleware.ts"
    depends: []
    patterns: []
    validate:
      - "npx tsc --noEmit 2>&1 | tail -20"

  - id: "T7"
    description: "Create admin layout with sidebar navigation (Dashboard, Products, Categories links)"
    action: "CREATE"
    path: "dresscave/app/(dashboard)/admin/layout.tsx"
    depends: []
    patterns:
      - "dresscave/app/(dashboard)/layout.tsx"
    validate:
      - "npx tsc --noEmit 2>&1 | tail -20"

  - id: "T8"
    description: "Create admin dashboard homepage with quick stats (total products, featured count, new arrivals)"
    action: "CREATE"
    path: "dresscave/app/(dashboard)/admin/page.tsx"
    depends: ["T7"]
    patterns:
      - "dresscave/app/(dashboard)/account/page.tsx"
    validate:
      - "npx tsc --noEmit 2>&1 | tail -20"

  - id: "T9"
    description: "Create admin products list page with table, search/filter, and inline featured/new arrival toggle buttons"
    action: "CREATE"
    path: "dresscave/app/(dashboard)/admin/products/page.tsx"
    depends: ["T4", "T7"]
    patterns:
      - "dresscave/app/(dashboard)/account/page.tsx"
    validate:
      - "npx tsc --noEmit 2>&1 | tail -20"

  - id: "T10"
    description: "Create reusable product form component (shared for create and edit) with fields: name, description, category, subcategory, price, sizes, colors, age_range, images"
    action: "CREATE"
    path: "dresscave/components/products/product-form.tsx"
    depends: ["T2", "T4", "T5"]
    patterns:
      - "dresscave/components/auth/signup-form.tsx"
      - "dresscave/components/profile/measurements-form.tsx"
    validate:
      - "npx tsc --noEmit 2>&1 | tail -20"

  - id: "T11"
    description: "Create product creation page using ProductForm in create mode"
    action: "CREATE"
    path: "dresscave/app/(dashboard)/admin/products/new/page.tsx"
    depends: ["T10"]
    patterns:
      - "dresscave/app/(dashboard)/account/measurements/page.tsx"
    validate:
      - "npx tsc --noEmit 2>&1 | tail -20"

  - id: "T12"
    description: "Create product edit page with dynamic [id] route — fetches product and passes to ProductForm in edit mode"
    action: "CREATE"
    path: "dresscave/app/(dashboard)/admin/products/[id]/edit/page.tsx"
    depends: ["T10", "T11"]
    patterns:
      - "dresscave/app/(dashboard)/account/measurements/page.tsx"
    validate:
      - "npx tsc --noEmit 2>&1 | tail -20"

  - id: "T13"
    description: "Create delete product confirmation dialog with soft delete"
    action: "CREATE"
    path: "dresscave/components/products/delete-product-dialog.tsx"
    depends: ["T4", "T9"]
    patterns:
      - "dresscave/components/profile/delete-account-dialog.tsx"
    validate:
      - "npx tsc --noEmit 2>&1 | tail -20"

  - id: "T14"
    description: "Create image uploader component with drag-and-drop, WebP optimization, preview thumbnails, set-primary, reorder, and delete"
    action: "CREATE"
    path: "dresscave/components/products/image-uploader.tsx"
    depends: ["T4"]
    patterns:
      - "dresscave/components/profile/measurements-form.tsx"
    validate:
      - "npx tsc --noEmit 2>&1 | tail -20"

  - id: "T15"
    description: "Create category management page with CRUD UI — list with hierarchy, inline add/edit/delete"
    action: "CREATE"
    path: "dresscave/app/(dashboard)/admin/categories/page.tsx"
    depends: ["T5", "T7"]
    patterns:
      - "dresscave/app/(dashboard)/account/page.tsx"
      - "dresscave/app/(dashboard)/admin/products/page.tsx"
    validate:
      - "npx tsc --noEmit 2>&1 | tail -20"

  - id: "T16"
    description: "Add product schema validation tests"
    action: "CREATE"
    path: "dresscave/tests/products/schemas.test.ts"
    depends: ["T2"]
    patterns:
      - "dresscave/tests/auth/schemas.test.ts"
    validate:
      - "npx vitest run --reporter=verbose 2>&1 | tail -30"

validation:
  commands:
    type_check: "npx tsc --noEmit 2>&1"
    lint: "npx next lint 2>&1 || true"
    test: "npx vitest run 2>&1 || echo 'No test runner configured'"
    build: "npm run build 2>&1 || echo 'No build command configured'"
